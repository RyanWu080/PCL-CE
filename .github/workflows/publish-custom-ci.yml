name: Publish custom CI release
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-custom-ci-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'RyanWu080/PCL-CE'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 40156950170
          path: artifacts
      - name: Package and publish verified build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: RyanWu080/PCL-CE
        shell: bash
        run: |
          set -euo pipefail
          for arch in x64 ARM64; do
            test -f "artifacts/PCL2_CE_CI_$arch/Plain Craft Launcher 2.exe"
            (cd "artifacts/PCL2_CE_CI_$arch" && zip -r "../../PCL-CE-unrestricted-$arch.zip" .)
          done
          sha256sum PCL-CE-unrestricted-*.zip > SHA256SUMS.txt
          cat > notes.md <<'NOTES'
          PCL-CE 自定义构建：解除地区功能限制。
          基于 custom/dev-unrestricted，提交 9c3c007c95d64b913b90d472c2ba5cab33f74931。
          x64、ARM64 编译成功；尚未进行启动、登录和下载功能的运行验证。
          这是个人 fork 的 CI 预发布版本，并非上游官方发行版。
          普通 Intel/AMD Windows 电脑请选择 x64，Windows ARM 设备请选择 ARM64。
          构建记录：https://github.com/RyanWu080/PCL-CE/actions/runs/40156950170
          NOTES
          gh release create custom-2026.10.25-9c3c007 --target 9c3c007c95d64b913b90d472c2ba5cab33f74931 --title 'PCL-CE 地区限制解除版 2026-10-25' --notes-file notes.md --prerelease --draft
          gh release upload custom-2026.10.25-9c3c007 PCL-CE-unrestricted-x64.zip PCL-CE-unrestricted-ARM64.zip SHA256SUMS.txt
          gh release edit custom-2026.10.25-9c3c007 --draft=false
